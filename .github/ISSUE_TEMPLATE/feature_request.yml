name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the board, print or workflow that the app doesn't handle well yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
